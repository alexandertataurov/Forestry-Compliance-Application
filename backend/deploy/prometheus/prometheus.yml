global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Метрики приложения, которые коллектор экспонирует на 8889
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Внутренние метрики самого коллектора (очень полезно для отладки экспортёров)
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  # (Опционально) сам Prometheus — удобно для здоровья/ресурсов прома
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]