apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      timeField: "@timestamp"
      index: "dev-logs*"
      esVersion: "8.0.0"
    logMessageField: "body"   

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
